name: boligbot

on:
  schedule:
    - cron: "*/5 * * * *"   # reserve — cron-job.org starter den hvert minut
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Hurtigt spor: kun Kereby (tjek + evt. automatisk booking). Kører uafhængigt af de andre sider.
  kereby:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: boligbot-kereby
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tjek Kereby
        run: python boligbot.py --kun Kereby
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANSOEGER_TELEFON: ${{ secrets.ANSOEGER_TELEFON }}
          ANSOEGER_EMAIL: ${{ secrets.ANSOEGER_EMAIL }}
          ANSOEGER_OM_OS: ${{ secrets.ANSOEGER_OM_OS }}
          ANSOEGER_NAVN: ${{ secrets.ANSOEGER_NAVN }}
          KEREBY_AUTOBOOK: ${{ secrets.KEREBY_AUTOBOOK }}
      - name: Gem hvilke boliger der er set
        run: |
          git config user.name "boligbot"
          git config user.email "boligbot@users.noreply.github.com"
          cp state.json /tmp/ny.json
          for forsoeg in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            git show origin/main:state.json > /tmp/gammel.json 2>/dev/null || echo '{"set":{},"fejl":{}}' > /tmp/gammel.json
            # Slå de to lister sammen, så ingen sete boliger går tabt
            python - <<'PY'
          import json
          ny = json.load(open("/tmp/ny.json")); gammel = json.load(open("/tmp/gammel.json"))
          gammel.get("set", {}).update(ny.get("set", {}))
          ny["set"] = gammel.get("set", {})
          fejl = gammel.get("fejl", {}); fejl.update(ny.get("fejl", {})); ny["fejl"] = fejl
          json.dump(ny, open("state.json", "w"), ensure_ascii=False, indent=1, sort_keys=True)
          PY
            git add state.json
            git diff --staged --quiet && exit 0
            git commit -q -m "opdater sete boliger"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "Kunne ikke gemme efter 6 forsøg (prøver igen næste kørsel)"

  # Langsomt spor: City Apartment, Balder, Heimstaden, EDC
  resten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: boligbot-resten
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tjek de andre sider
        run: python boligbot.py --uden Kereby
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANSOEGER_TELEFON: ${{ secrets.ANSOEGER_TELEFON }}
          ANSOEGER_EMAIL: ${{ secrets.ANSOEGER_EMAIL }}
          ANSOEGER_OM_OS: ${{ secrets.ANSOEGER_OM_OS }}
          ANSOEGER_NAVN: ${{ secrets.ANSOEGER_NAVN }}
          KEREBY_AUTOBOOK: ${{ secrets.KEREBY_AUTOBOOK }}
      - name: Gem hvilke boliger der er set
        run: |
          git config user.name "boligbot"
          git config user.email "boligbot@users.noreply.github.com"
          cp state.json /tmp/ny.json
          for forsoeg in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            git show origin/main:state.json > /tmp/gammel.json 2>/dev/null || echo '{"set":{},"fejl":{}}' > /tmp/gammel.json
            # Slå de to lister sammen, så ingen sete boliger går tabt
            python - <<'PY'
          import json
          ny = json.load(open("/tmp/ny.json")); gammel = json.load(open("/tmp/gammel.json"))
          gammel.get("set", {}).update(ny.get("set", {}))
          ny["set"] = gammel.get("set", {})
          fejl = gammel.get("fejl", {}); fejl.update(ny.get("fejl", {})); ny["fejl"] = fejl
          json.dump(ny, open("state.json", "w"), ensure_ascii=False, indent=1, sort_keys=True)
          PY
            git add state.json
            git diff --staged --quiet && exit 0
            git commit -q -m "opdater sete boliger"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "Kunne ikke gemme efter 6 forsøg (prøver igen næste kørsel)"
