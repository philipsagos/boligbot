name: boligbot

on:
  schedule:
    - cron: "*/5 * * * *"   # hvert 5. minut (GitHubs minimum)
  workflow_dispatch:         # giver en "Run workflow"-knap til manuel test

permissions:
  contents: write

concurrency:
  group: boligbot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gem browseren mellem kørsler
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Installer usynlig browser
        run: python -m playwright install --with-deps chromium

      - name: Kør boligbot
        run: python boligbot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANSOEGER_TELEFON: ${{ secrets.ANSOEGER_TELEFON }}
          ANSOEGER_EMAIL: ${{ secrets.ANSOEGER_EMAIL }}
          ANSOEGER_OM_OS: ${{ secrets.ANSOEGER_OM_OS }}

      - name: Gem hvilke boliger der er set
        run: |
          git config user.name "boligbot"
          git config user.email "boligbot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "opdater sete boliger" && git pull --rebase && git push)
